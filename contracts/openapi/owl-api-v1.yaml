        attachment_ids:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ULID'
      additionalProperties: false
    InboundAck:
      type: object
      required:
        - request_id
        - ack_id
        - message_id
        - event_id
        - deduplicated
        - status
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        ack_id:
          $ref: '#/components/schemas/ULID'
        message_id:
          $ref: '#/components/schemas/ULID'
        event_id:
          type:
