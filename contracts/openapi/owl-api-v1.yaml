    AdvisorAction:
      type: object
      description: >-
        Supported types and payloads: create_work; start_work; pause_work {work_id,
        reason?}; resume_work {work_id, body?} (body: 1-10000 chars, recorded as the answer to the retry Decision; ignored for a paused Work); reopen_work; cancel_work {work_id, reason?,
        force?}; delete_work {work_id, reason?} (memo, ready, completed or cancelled Works only;
        permanently deletes); send_work_instruction {work_id, body, reopen?}; update_work {work_id,
        title?, summary?} (at least one); answer_decision; send_file; run_librarian /
        run_skill_curation / run_rule_curation. send_work_instruction requires a body
        of 1 to 100,000 characters. update_work replaces the complete title and/or
        summary; title must be 1 to 500 characters and summary 0 to 20,000
        characters (an empty summary is allowed). The length limits apply to the
        input before trimming, and body and title must contain at least one
        non-whitespace character. run_librarian / run_skill_curation /
        run_rule_curation may omit payload or set it to null; if given, payload may
        contain only reason. A failed curation run returns 500 curation_failed. All
        other types require payload. The new work actions may be rejected
        with validation_error, work_not_found, invalid_state_transition,
        work_cancelled, work_reopen_required, or version_conflict.
      required:
        - action_id
        - sequence
        - type
        - expected_version
      allOf:
        - if:
            properties:
              type:
                enum:
                  - run_librarian
                  - run_skill_curation
                  - run_rule_curation
          then:
            properties:
              payload:
                oneOf:
                  - type: 'null'
                  - type: object
                    properties:
                      reason: {}
                    additionalProperties: false
          else:
            required:
              - payload
            properties:
              payload:
                $ref: '#/components/schemas/OpaqueObject'
      properties:
        action_id:
          type: string
        sequence:
          type: integer
        type:
          type: string
          enum:
            - create_work
            - start_work
            - pause_work
            - resume_work
            - reopen_work
            - cancel_work
            - delete_work
            - send_work_instruction
            - update_work
            - answer_decision
            - send_file
            - run_librarian
            - run_skill_curation
            - run_rule_curation
        payload:
          description: Action payload; constrained per type by if/then/else above.
        expected_version:
          type: integer
          minimum: 0
      additionalProperties: false
    AdvisorActionsPayload:
      type: object
      required:
        - invocation_id
        - actions
      properties:
        invocation_id:
          $ref: '#/components/schemas/ULID'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AdvisorAction'
      additionalProperties: false
    AdvisorActionsCommand:
