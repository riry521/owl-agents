    AgentRun:
      type: object
      required:
        - id
        - work_id
        - task_id
        - role
        - provider
        - model
        - status
        - outcome
        - pid
        - started_at
        - ended_at
        - last_output_at
        - parent_agent_id
        - phase
        - subtask_count
        - label
        - origin
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        work_id:
          description: The Work the run belongs to; null for runs outside any Work.
          type:
            - string
            - 'null'
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        task_id:
          type:
            - string
            - 'null'
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        role:
          type: string
        provider:
          type: string
        model:
          type: string
        effort:
          type: [string, 'null']
        status:
          type: string
        outcome:
          description: What a completed run's valid result said; null for runs that did not complete.
          type:
            - string
            - 'null'
          enum:
            - success
            - redo
            - replan
            - question
            - partial
            - not_achieved
            - null
        pid:
          type:
            - integer
            - 'null'
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        ended_at:
          type:
            - string
            - 'null'
          format: date-time
        last_output_at:
          description: When the run last produced output; null before its first output.
          type:
            - string
            - 'null'
          format: date-time
        parent_agent_id:
          description: Executor runs only. The AgentRun that started it (a Hybrid Worker, or the run an observed subagent was found under).
          type:
            - string
            - 'null'
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        phase:
          description: Hybrid Worker runs only. The Hybrid phase the Worker is in.
          type:
            - string
            - 'null'
          enum:
            - plan
            - executing
            - verdict
            - null
        subtask_count:
          description: Hybrid Worker runs only. How many subtasks the plan produced.
          type:
            - integer
            - 'null'
          minimum: 0
        label:
          description: Executor runs only. The subtask or agent CLI command it is working on.
          type:
            - string
            - 'null'
        origin:
          description: Executor runs only. spawned when Owl launched it (Hybrid Executor); observed when Core found an agent CLI in another run's process tree.
          type:
            - string
            - 'null'
          enum:
            - spawned
            - observed
            - null
      additionalProperties: false
    AgentRunListResponse:
      allOf:
        - $ref: '#/components/schemas/ListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AgentRun'
