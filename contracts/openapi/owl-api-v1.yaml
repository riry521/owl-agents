      type: object
      required: [librarian_times, research_autosave, time_zone]
      properties:
        librarian_times:
          type: array
          maxItems: 24
          description: HH:MM times; the server deduplicates and sorts them.
          items: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        research_autosave: { type: boolean }
        research_source_links: { type: integer, minimum: 0, description: Must not exceed research_source_links_max. }
        research_source_links_max: { type: integer, minimum: 0 }
        research_tags_min: { type: integer, minimum: 1 }
        research_tags_max: { type: integer, minimum: 1, description: Not below research_tags_min. }
        research_existing_tags_max: { type: integer, minimum: 1 }
        time_zone: { type: string, description: Host time zone (read-only). }
      additionalProperties: true
    UpdateKnowledgeAutomationSettingsPayload:
      type: object
      required: [librarian_times, research_autosave]
      description: The research_* keys are optional; no other keys are accepted.
      properties:
        librarian_times:
          type: array
          maxItems: 24
          description: HH:MM times; the server deduplicates and sorts them.
          items: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        research_autosave: { type: boolean }
        research_source_links: { type: integer, minimum: 0, description: Must not exceed research_source_links_max. }
        research_source_links_max: { type: integer, minimum: 0 }
        research_tags_min: { type: integer, minimum: 1 }
        research_tags_max: { type: integer, minimum: 1, description: Not below research_tags_min. }
        research_existing_tags_max: { type: integer, minimum: 1 }
      additionalProperties: false
