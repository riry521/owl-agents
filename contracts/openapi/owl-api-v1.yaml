    MemoryNoteTypeKb:
      type: string
      enum:
        - preference
        - decision
        - lesson
        - procedure
        - reference
        - overview
        - north-star
        - reflection
        - log
        - raw
    MemoryRef:
      type: object
      required: [id, path, title]
      properties:
        id: { type: string }
        path: { type: string }
        title: { type: string }
    MemoryNoteStatus:
      type: string
      enum: [active, dormant, superseded, archived, draft]
    MemoryMatch:
      type: string
      enum: [fts, vec, both]
    MemorySearchItem:
      type: object
      required: [id, path, title, type, summary, status, importance, updated, score, match]
      properties:
        id: { type: string }
        path: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/MemoryNoteTypeKb" }
        summary: { type: string }
        status: { $ref: "#/components/schemas/MemoryNoteStatus" }
        importance: { type: number }
        updated: { type: [string, "null"] }
        score: { type: number }
        match: { $ref: "#/components/schemas/MemoryMatch" }
    MemorySearchResult:
      type: object
      description: Unwrapped Core memory output (no request_id envelope).
      required: [items, stale, index_at, mode]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MemorySearchItem" }
        stale: { type: boolean }
        index_at: { type: [string, "null"] }
        mode: { type: string, enum: [hybrid, fts] }
        note: { type: string, description: Present when the index or embedder is unavailable. }
    MemoryExpandResult:
      description: Unwrapped Core memory output (no request_id envelope). found=true with the note; otherwise ambiguous candidates or did_you_mean suggestions.
      oneOf:
        - type: object
          required: [found, id, path, frontmatter, body, truncated, links_out, linked_from, superseded_chain, stale]
          properties:
            found: { type: boolean, const: true }
            id: { type: string }
            path: { type: string }
            frontmatter:
              type: object
              additionalProperties:
                oneOf:
                  - type: string
                  - type: array
                    items: { type: string }
            body: { type: [string, "null"] }
            truncated: { type: boolean }
            links_out:
              type: array
              items:
                type: object
                required: [filename, title, status, path, resolved]
                properties:
                  filename: { type: string }
                  title: { type: [string, "null"] }
                  status:
                    oneOf:
                      - $ref: "#/components/schemas/MemoryNoteStatus"
                      - type: "null"
                  path: { type: [string, "null"] }
                  resolved: { type: boolean }
            linked_from:
              type: array
              items: { $ref: "#/components/schemas/MemoryRef" }
            superseded_chain:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/MemoryRef"
                  - type: object
                    required: [status]
                    properties:
                      status: { $ref: "#/components/schemas/MemoryNoteStatus" }
            stale: { type: boolean }
        - type: object
          required: [found, ambiguous, candidates, stale]
          properties:
            found: { type: boolean, const: false }
            ambiguous: { type: boolean, const: true }
            candidates:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/MemoryRef"
                  - type: object
                    required: [type]
                    properties:
                      type: { $ref: "#/components/schemas/MemoryNoteTypeKb" }
            stale: { type: boolean }
        - type: object
          required: [found, ambiguous, did_you_mean, stale]
          properties:
            found: { type: boolean, const: false }
            ambiguous: { type: boolean, const: false }
            did_you_mean:
              type: array
              items: { $ref: "#/components/schemas/MemoryRef" }
            stale: { type: boolean }
    MemoryRecallResult:
      type: object
      description: Unwrapped Core memory output (no request_id envelope).
      required: [items, superseded, stale, index_at]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/MemorySearchItem"
              - type: object
                properties:
                  reason: { type: string }
        superseded:
          type: array
          items: { $ref: "#/components/schemas/MemorySearchItem" }
        explain:
          type: array
          description: Present when explain=true.
          items:
            type: object
            required: [id, reason]
            properties:
              id: { type: string }
              reason: { type: string }
        stale: { type: boolean }
        index_at: { type: [string, "null"] }
    MemoryReindexResult:
      type: object
      description: Unwrapped Core memory output (no request_id envelope).
      required: [mode, scanned, added, updated, removed, unchanged, duration_ms, errors]
      properties:
        mode: { type: string, enum: [diff, full] }
        scanned: { type: integer }
        added: { type: integer }
        updated: { type: integer }
        removed: { type: integer }
        unchanged: { type: integer }
        duration_ms: { type: number }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
        embedded: { type: integer }
    MemoryPageBudget:
      type: object
      properties:
        pages_used: { type: integer }
        pages_limit: { type: integer }
        tokens_used: { type: integer }
        tokens_limit: { type: integer }
        clippings_used: { type: integer }
        clippings_limit: { type: integer }
    MemoryPageOutline:
      type: array
      items:
        type: object
        required: [section, lines]
        properties:
          section: { type: string }
          lines: { type: integer }
    MemoryPageReadResult:
      description: Unwrapped Core memory output (no request_id envelope), returned with 200 in every branch. found=true with the page text; found=false with did_you_mean; or an error branch (page_budget_exceeded, clipping_budget_exceeded, unknown_sections, index_unavailable).
      oneOf:
        - type: object
          required: [found, path, title, kind, text, tokens, truncated, stale]
          properties:
            found: { type: boolean, const: true }
            path: { type: string }
            title: { type: string }
            kind: { type: string, enum: [theme, project-index, work-log, clipping, conversation-log, legacy, archive, material] }
            text: { type: string }
            tokens: { type: integer }
            truncated: { type: boolean }
            stale: { type: boolean }
            budget: { $ref: "#/components/schemas/MemoryPageBudget" }
        - type: object
          required: [found, did_you_mean, stale]
          properties:
            found: { type: boolean, const: false }
            did_you_mean:
              type: array
              items: { $ref: "#/components/schemas/MemoryRef" }
            stale: { type: boolean }
        - type: object
          required: [error, outline, budget]
          properties:
            error: { type: string, const: page_budget_exceeded }
            outline: { $ref: "#/components/schemas/MemoryPageOutline" }
            budget: { $ref: "#/components/schemas/MemoryPageBudget" }
        - type: object
          required: [error, budget]
          properties:
            error: { type: string, const: clipping_budget_exceeded }
            budget: { $ref: "#/components/schemas/MemoryPageBudget" }
        - type: object
          required: [error, outline]
          properties:
            error: { type: string, const: unknown_sections }
            outline: { $ref: "#/components/schemas/MemoryPageOutline" }
        - type: object
          required: [error]
          properties:
            error: { type: string, const: index_unavailable }
    MemoryPageSearchResult:
      type: object
      description: Unwrapped Core memory output (no request_id envelope); error is set (still 200) when the index is unavailable or the search budget is exceeded.
      required: [items, stale]
      properties:
        items:
          type: array
          items:
            type: object
            required: [path, title, summary, score, match]
            properties:
              path: { type: string }
              title: { type: string }
              summary: { type: string }
              score: { type: number }
              match: { $ref: "#/components/schemas/MemoryMatch" }
        stale: { type: boolean }
        mode: { type: string, enum: [hybrid, fts] }
        note: { type: string }
        error: { type: string, enum: [index_unavailable, search_budget_exceeded] }
    MemoryAppendResult:
      type: object
      description: Unwrapped Core page-router result (no request_id envelope). Core append errors are mapped to 400 or 503 and never returned with 200.
      required: [status]
      properties:
        status: { type: string, enum: [appended, duplicate, skill_proposal, rejected, deferred] }
