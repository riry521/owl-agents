          type: array
          items:
            $ref: '#/components/schemas/ULID'
        prerequisite:
          oneOf:
            - $ref: '#/components/schemas/TaskPrerequisite'
            - type: 'null'
          description: Set while the Task waits on a prerequisite.
        stop_reason:
          type: [string, 'null']
          description: For a judgement_waiting Task, the reason of the open Decision that blocks it (for example the no-progress limit).
        fixer_escalation:
          oneOf:
            - type: object
              required:
                - rejections
              properties:
                rejections:
                  type: integer
                  minimum: 1
              additionalProperties: false
            - type: 'null'
          description: Set once a rejected Worker Task moved to the Fixer; rejections is the combined verification-failure and review rejection count at that point.
      additionalProperties: false
    TaskPrerequisite:
      type: object
