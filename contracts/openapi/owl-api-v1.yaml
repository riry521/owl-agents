                turn_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                message_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                results:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - index
                      - outcome
                    properties:
                      index:
                        type: integer
                        minimum: 0
