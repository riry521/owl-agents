        lead_review_rejections: { type: integer, minimum: 1, maximum: 100 }
        verification_paths:
          type: array
          minItems: 1
          maxItems: 200
          description: Repo-relative globs counted as tests or verification scripts.
          items: { type: string, minLength: 1, maxLength: 500 }
        checked_task_types:
          type: array
          uniqueItems: true
          items: { type: string, enum: [research, design, code, config, doc, test] }
      additionalProperties: false
    UpdateRemakeLimitSettingsPayload:
