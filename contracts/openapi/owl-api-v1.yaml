  /api/v1/owner-files/{path}:
    parameters:
      - in: path
        name: path
        required: true
        description: '"{root key}/{relative path}" with slashes kept in the URL; each segment is percent-decoded. A trailing slash selects the folder listing.'
        schema:
          type: string
    get:
      operationId: getOwnerFile
      summary: Read an Owner file or folder
      description: Serves a file under an Owner file root, or an HTML folder listing. Content-Type follows the extension (html, css, js, json, md, txt, csv, images, audio, video, pdf; otherwise application/octet-stream). A single Range (bytes=a-b, a-, -n) is supported. Folder URLs without a trailing slash redirect (308). 403 owner_file_denied for unknown roots, traversal, symlink escapes, secret or non-regular files.
      security:
        - ownerBearer: []
      responses:
        "200":
          description: File bytes, or an HTML folder listing (text/html) when the path is a folder ending in "/".
          headers:
            Accept-Ranges:
              schema:
                type: string
                enum:
                  - bytes
            Last-Modified:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                  - nosniff
            Content-Security-Policy:
              schema:
                type: string
              description: Scripts and connect-src disabled.
          content:
            "*/*":
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
        "206":
          description: Partial content for a Range request.
          headers:
            Accept-Ranges:
              schema:
                type: string
                enum:
                  - bytes
            Last-Modified:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                  - nosniff
            Content-Security-Policy:
              schema:
                type: string
              description: Scripts and connect-src disabled.
            Content-Range:
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "308":
          description: Folder requested without a trailing slash; Location is the same URL ending in "/".
          headers:
            Location:
              schema:
                type: string
        "400":
          description: Request validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Owner file access denied (owner_file_denied).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found (owner_file_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "416":
          description: Range not satisfiable.
