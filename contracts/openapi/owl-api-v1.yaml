openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Owl API v1
  version: 1.0.0
  description: REST and WebSocket wire contract for the Owl MVP.
x-contract-version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Core health
      description: Loopback-only health endpoint.
      security: []
      responses:
        '200':
          description: Core is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: core_not_ready
          x-error-codes:
            - core_not_ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: System status
      security:
        - ownerBearer: []
        - localCsrf: []
      parameters:
        - in: query
          name: verbose
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: System status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works:
    get:
      operationId: listWorks
      summary: List works
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: state
          required: false
          schema:
            type:
              - string
              - 'null'
        - in: query
          name: archived
          required: false
          schema:
            type: string
            enum:
              - exclude
              - include
              - only
            default: exclude
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: cursor
          required: false
          schema:
            type:
              - string
              - 'null'
      responses:
        '200':
          description: Work list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkListResponse'
        '400':
          description: invalid_query
          x-error-codes:
            - invalid_query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createWork
      summary: Create a work
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkCommand'
      responses:
        '201':
          description: Work created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkResponse'
        '400':
          description: validation_error
          x-error-codes:
            - validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: project_not_found or prerequisite_work_not_found
          x-error-codes:
            - project_not_found
            - prerequisite_work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: idempotency_conflict
          x-error-codes:
            - idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: getWork
      summary: Get a work
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: include
          required: false
          schema:
            type:
              - string
              - 'null'
      responses:
        '200':
          description: Work detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDetailResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteWork
      summary: Permanently delete a memo, ready, completed or cancelled work
      description: Deletes only a work in memo, ready, completed or cancelled state; cancelling or archiving is not required. The deletion is complete and leaves no trace (conversations, messages, learning jobs, backlog items, uploads, artifacts and worktrees are removed). Any other state returns 409 invalid_state_transition.
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyCommand'
      responses:
        '200':
          description: Work deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkResponse'
        '400':
          description: Invalid command envelope or payload.
          x-error-codes:
            - validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Work state, version, or idempotency conflict.
          x-error-codes:
            - invalid_state_transition
            - work_has_active_agents
            - work_has_open_decisions
            - version_conflict
            - idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: dependency_unavailable or worktree_cleanup_failed. For worktree_cleanup_failed, details include each blocked worktree path, ignored_count, and ignored_paths.
          x-error-codes:
            - dependency_unavailable
            - worktree_cleanup_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkErrorResponse'
  /api/v1/works/{work_id}/branch-status:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: getWorkBranchStatus
      summary: Whether the Work's branches hold changes outside the Project base branch
      description: Read from Git refs on demand. unknown when the status could not be read; clients treat it as possibly unmerged.
      security:
        - ownerBearer: []
      responses:
        '200':
          description: Work branch status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkBranchStatusResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/designs:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: listWorkDesigns
      summary: List external design documents for a Work
      security:
        - ownerBearer: []
      responses:
        '200':
          description: Design documents in Task order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDesignListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/design-mocks:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: listWorkDesignMocks
      summary: List the HTML mocks of a Work's screen design Tasks
      security:
        - ownerBearer: []
      responses:
        '200':
          description: Saved mocks in Task order, read from the database only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDesignMockListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/design-mocks/{task_id}/{name}:
    parameters:
      - $ref: '#/components/parameters/WorkId'
      - $ref: '#/components/parameters/TaskId'
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}\.html$'
    get:
      operationId: getWorkDesignMock
      summary: Serve one saved HTML mock
      description: Served with a Content-Security-Policy that sandboxes the document into an opaque origin.
      security:
        - ownerBearer: []
      responses:
        '200':
          description: The mock HTML as saved.
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: design_mock_not_found (also for a malformed name, another Work's Task or a Task that is not a screen design)
          x-error-codes:
            - design_mock_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/markdown:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: getWorkMarkdown
      summary: Read one Markdown file of a Work
      description: Reads a .md file inside the Work's Project or the materials folder.
      security:
        - ownerBearer: []
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute, Project-relative, or materials/-prefixed path.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      responses:
        '200':
          description: The file's Markdown text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkMarkdownResponse'
        '400':
          description: validation_error
          x-error-codes:
            - validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: markdown_path_denied; details.reason is outside, symlink_escape, traversal, secret or not_markdown.
          x-error-codes:
            - markdown_path_denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found, markdown_not_found, or markdown_not_integrated for a Work that is not finished.
          x-error-codes:
            - work_not_found
            - markdown_not_found
            - markdown_not_integrated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: markdown_too_large; details has size_bytes and limit_bytes.
          x-error-codes:
            - markdown_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: markdown_unreadable
          x-error-codes:
            - markdown_unreadable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: knowledge_storage_unavailable or dependency_unavailable
          x-error-codes:
            - knowledge_storage_unavailable
            - dependency_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/conversation:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: getWorkConversation
      summary: Get a Work conversation with instruction status
      security:
        - ownerBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Messages oldest first; the newest `limit` are returned when truncated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkConversationResponse'
        '400':
          description: validation_error
          x-error-codes:
            - validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: dependency_unavailable
          x-error-codes:
            - dependency_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/view:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: getWorkView
      summary: Get everything the Work detail screen shows in one response
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: conversation_limit
          required: false
          description: Most recent conversation messages to return (1-500). Defaults to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Screen data in one response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkViewResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: not_found
          x-error-codes:
            - not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: dependency_unavailable
          x-error-codes:
            - dependency_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/assurance:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: getWorkAssurance
      summary: Get why reviews were skipped or forced, the integration verification result and plan quality warnings
      security:
        - ownerBearer: []
      responses:
        '200':
          description: Recorded review routing per Task, the latest integration verification and the plan quality warnings.
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - data
                properties:
                  request_id:
                    type: string
                  data:
                    type: object
                    required:
                      - work_id
                      - reviews
                      - integration_verification
                      - plan_quality_warnings
                    properties:
                      work_id:
                        type: string
                      reviews:
                        type: array
                        items:
                          type: object
                          required:
                            - task_id
                            - required
                            - base
                            - skip_reason
                            - forced_reasons
                          properties:
                            task_id:
                              type: string
                            required:
                              type: boolean
                            base:
                              type: string
                            skip_reason:
                              type: string
                              nullable: true
                            forced_reasons:
                              type: array
                              items:
                                type: object
                                required:
                                  - code
                                  - detail
                                properties:
                                  code:
                                    type: string
                                  detail:
                                    type: string
                      integration_verification:
                        type: object
                        nullable: true
                        additionalProperties: true
                      plan_quality_warnings:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: dependency_unavailable
          x-error-codes:
            - dependency_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/backlog:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: listWorkBacklog
      summary: List review backlog items from a Work
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Backlog items originating from the Work, in any status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogListResponse'
        '400':
          description: Invalid Work ID.
          x-error-codes: [validation_error]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes: [work_not_found]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/designs/{task_id}:
    parameters:
      - $ref: '#/components/parameters/WorkId'
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getWorkDesign
      summary: Read one external design document
      security:
        - ownerBearer: []
      responses:
        '200':
          description: Design document contents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDesignResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found or design_document_not_found
          x-error-codes:
            - work_not_found
            - design_document_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      operationId: archiveWork
      summary: Archive a completed or cancelled work
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyCommand'
      responses:
        '200':
          description: Work archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveWorkResponse'
        '400':
          description: Invalid command envelope or payload.
          x-error-codes:
            - validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Work state, version, or idempotency conflict.
          x-error-codes:
            - invalid_state_transition
            - work_has_active_agents
            - work_has_open_decisions
            - version_conflict
            - idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: dependency_unavailable
          x-error-codes:
            - dependency_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      operationId: unarchiveWork
      summary: Remove a work from the archive
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyCommand'
      responses:
        '200':
          description: Work unarchived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnarchiveWorkResponse'
        '400':
          description: Invalid command envelope or payload.
          x-error-codes:
            - validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Work state, version, or idempotency conflict.
          x-error-codes:
            - invalid_state_transition
            - version_conflict
            - idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: dependency_unavailable
          x-error-codes:
            - dependency_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/project:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      operationId: moveWorkToProject
      summary: Move a projectless Work into a Project
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveWorkToProjectCommand'
      responses:
        '200':
          description: Work moved to the Project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveWorkToProjectResponse'
        '400':
          description: Invalid command envelope or project_id.
          x-error-codes: [validation_error]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Owner authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin or CSRF check failed, or Advisor action required.
          x-error-codes: [advisor_action_required, forbidden]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Work or Project not found.
          x-error-codes: [work_not_found, project_not_found]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: State, version, ownership, active agent, or idempotency conflict.
          x-error-codes: [invalid_state_transition, work_project_already_set, work_has_active_agents, version_conflict, idempotency_conflict]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Move dependency unavailable or projectless outputs could not be saved.
          x-error-codes: [dependency_unavailable, worktree_cleanup_failed]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/prerequisites:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    put:
      operationId: replaceWorkPrerequisites
