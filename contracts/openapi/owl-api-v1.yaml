components:
  securitySchemes:
    ownerBearer:
      type: http
      scheme: bearer
    localCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
    connectorServiceToken:
      type: http
      scheme: bearer
    advisorServiceToken:
      type: http
      scheme: bearer
    agentToken:
      type: http
      scheme: bearer
  parameters:
    SkillName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
    SkillFilePath:
      name: path
      in: path
      required: true
      description: Slash-delimited relative path to SKILL.md or a file directly under an allowed skill directory.
      schema:
        type: string
        minLength: 1
    SkillRevisionId:
      name: revision_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    SkillProposalId:
      name: proposal_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkId:
      name: work_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    DecisionId:
      name: decision_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    AgentRunId:
      name: agent_run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
  schemas:
    ULID:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
    RFC3339:
      type: string
      format: date-time
    Version:
      type: integer
      minimum: 0
    WorkState:
      type: string
      minLength: 1
      description: >-
        Known values are memo, ready (waiting for prerequisite Works), running,
        paused, judgement_waiting, completed, and cancelled. Servers may return future values, which
        clients must preserve and render safely.
    WorkSize:
      type: string
      enum:
        - small
        - normal
        - large
    TaskState:
      type: string
      enum:
        - waiting
        - ready
        - running
        - paused
        - verifying
        - review_fix_waiting
        - failed
        - judgement_waiting
        - completed
        - cancelled
    MessageSource:
      type: string
      enum:
        - slack
        - discord
        - web
        - advisor
        - manager
    MessageMetadata:
      oneOf:
        - $ref: '#/components/schemas/InstructionReplyMetadata'
        - $ref: '#/components/schemas/AdvisorFileDeliveryMetadata'
      discriminator:
        propertyName: kind
        mapping:
          instruction_reply: '#/components/schemas/InstructionReplyMetadata'
          advisor_file_delivery: '#/components/schemas/AdvisorFileDeliveryMetadata'
    AdvisorFileDeliveryMetadata:
      type: object
      required: [kind, destination, refusal, files]
      properties:
        kind:
          type: string
          enum: [advisor_file_delivery]
        destination:
          type: object
          nullable: true
          required: [provider, channel_id, display_name, source]
          properties:
            provider: { type: string, enum: [slack, discord] }
            channel_id: { type: string }
            display_name: { type: string }
            source: { type: string, enum: [window_binding, default_destination] }
          additionalProperties: false
        refusal:
          type: string
          nullable: true
          enum: [preferred_provider_unset, default_destination_unset, default_provider_not_configured, default_channel_unavailable]
        files:
          type: array
          items:
            type: object
            required: [index, name, size, status]
            properties:
              index: { type: integer }
              name: { type: string }
              size: { type: integer, nullable: true }
              status: { type: string, enum: [pending, sent, failed, unknown, rejected] }
              code: { type: string }
              message: { type: string, maxLength: 300 }
            additionalProperties: false
        notice:
          type: string
      additionalProperties: false
    InstructionReplyMetadata:
      type: object
      required:
        - kind
        - in_reply_to
        - outcome
        - plan_revision
      properties:
        kind:
          type: string
          enum:
            - instruction_reply
        in_reply_to:
          type: array
          items:
            $ref: '#/components/schemas/ULID'
        outcome:
          type: string
          enum:
            - tasks_changed
            - no_change
            - decision_opened
        plan_revision:
          type: integer
          nullable: true
      additionalProperties: false
    InstructionStatus:
      type: object
      required:
        - status
        - outcome
        - reply_message_id
      properties:
        status:
          type: string
          enum:
            - queued
            - processing
            - answered
        outcome:
          type: string
          nullable: true
          enum:
            - tasks_changed
            - no_change
            - decision_opened
            - null
        reply_message_id:
          type: string
          nullable: true
      additionalProperties: false
    WorkConversationMessage:
      type: object
      required:
        - id
        - conversation_id
        - source
        - body
        - attachment_ids
        - created_at
        - received_at
        - instruction
        - in_reply_to
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        conversation_id:
          $ref: '#/components/schemas/ULID'
        source:
          $ref: '#/components/schemas/MessageSource'
        body:
          type: string
        attachment_ids:
          type: array
          items:
            $ref: '#/components/schemas/ULID'
        received_at:
          $ref: '#/components/schemas/RFC3339'
        created_at:
          $ref: '#/components/schemas/RFC3339'
        metadata:
          allOf:
            - $ref: '#/components/schemas/MessageMetadata'
          nullable: true
        instruction:
          allOf:
            - $ref: '#/components/schemas/InstructionStatus'
          nullable: true
        in_reply_to:
          type: array
          items:
            $ref: '#/components/schemas/ULID'
      additionalProperties: false
    WorkConversationResponse:
      type: object
      required:
        - request_id
        - data
      properties:
        request_id:
          type: string
        data:
          type: object
          required:
            - work_id
            - conversation_id
            - truncated
            - messages
          properties:
            work_id:
              $ref: '#/components/schemas/ULID'
            conversation_id:
              type: string
              nullable: true
            truncated:
              type: boolean
            messages:
              type: array
              items:
                $ref: '#/components/schemas/WorkConversationMessage'
          additionalProperties: false
      additionalProperties: false
    OpaqueObject:
      type: object
      additionalProperties: true
    CommandRequest:
      type: object
      required:
        - request_id
        - idempotency_key
        - expected_version
        - payload
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
        expected_version:
          $ref: '#/components/schemas/Version'
        payload:
          type: object
          additionalProperties: true
      additionalProperties: false
    EmptyCommand:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/EmptyPayload'
    Response:
      type: object
      required:
        - request_id
        - data
        - version
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          type: object
          additionalProperties: true
        version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    ListResponse:
      type: object
      required:
        - request_id
        - data
        - cursor
        - has_more
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
      additionalProperties: false
    EventFrame:
      type: object
      description: Same shape as the WebSocket `event` frame (WebSocketServerFrame).
      required:
        - kind
        - event_id
        - sequence
        - cursor
        - type
        - schema_version
        - payload
      properties:
        kind:
          const: event
        event_id:
          $ref: '#/components/schemas/ULID'
        sequence:
          type: integer
        cursor:
          type: string
        type:
          type: string
          description: Canonical event name; title or summary edits emit work.updated.
        schema_version:
          const: 1.0.0
        work_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        task_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        agent_run_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/RFC3339'
        payload:
          type: object
          additionalProperties: true
      additionalProperties: false
    EventListResponse:
      type: object
      required:
        - request_id
        - data
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          type: object
          required:
            - events
            - cursor
            - has_more
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/EventFrame'
            cursor:
              type: string
              description: >-
                Ascending: sequence of the last event (or the `after` value when
                empty). Descending: sequence of the oldest event in the page,
                to pass as `before` for the next older page.
            has_more:
              type: boolean
          additionalProperties: false
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - request_id
        - error
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          additionalProperties: false
      additionalProperties: false
    KnowledgeStorageUpdateValidationErrorResponse:
      type: object
      required:
        - request_id
        - error
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        error:
          oneOf:
            - type: object
              required:
                - code
                - message
                - details
              properties:
                code:
                  type: string
                  enum: [validation_error]
                message:
                  type: string
                details:
                  type: object
                  additionalProperties: true
              additionalProperties: false
            - type: object
              required:
                - code
                - message
                - details
              properties:
                code:
                  type: string
                  enum: [knowledge_target_invalid]
                message:
                  type: string
                details:
                  type: object
                  required:
                    - reason
                  properties:
                    reason:
                      type: string
                      enum: [same_as_current, nested, reserved, not_directory, not_empty, parent_missing, not_writable, relink_requires_unavailable]
                  additionalProperties: true
              additionalProperties: false
      additionalProperties: false
    WorktreeCleanupIssue:
      type: object
      required:
        - path
        - ignored_count
        - ignored_paths
      properties:
        path:
          type: string
        ignored_count:
          type: integer
          minimum: 0
        ignored_paths:
          type: array
          items:
            type: string
      additionalProperties: false
    WorktreeCleanupErrorDetails:
      type: object
      properties:
        worktrees:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeCleanupIssue'
      additionalProperties: true
    DeleteWorkErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              required:
                - code
                - details
              properties:
                code:
                  type: string
                  enum:
                    - dependency_unavailable
                    - worktree_cleanup_failed
                details:
                  $ref: '#/components/schemas/WorktreeCleanupErrorDetails'
    EmptyPayload:
      type: object
      additionalProperties: false
    CreateWorkPayload:
      type: object
      required:
        - title
        - summary
        - size
        - project_id
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        summary:
          type: string
          maxLength: 20000
        size:
          type: string
          description: small creates one focused Task directly for the Worker; normal and large start with Manager planning.
          enum:
            - small
            - normal
            - large
        project_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        design_mode:
          type: string
          enum: [auto, lead]
          description: Optional. Lead assigns design Tasks to Lead Designer from their first run.
        prerequisite_work_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ULID'
          description: Optional. Works that must be completed before this Work starts; it waits in state ready until then.
      additionalProperties: false
    CreateWorkCommand:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/CreateWorkPayload'
    WorkSummary:
      type: object
      required:
        - id
        - display_number
        - title
        - state
        - state_version
        - updated_at
        - archived_at
        - project_id
        - prerequisite_wait
        - waiting_on
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        display_number:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        title:
          type: string
        state:
          $ref: '#/components/schemas/WorkState'
        state_version:
          $ref: '#/components/schemas/Version'
        updated_at:
          $ref: '#/components/schemas/RFC3339'
        archived_at:
          anyOf:
            - $ref: '#/components/schemas/RFC3339'
            - type: 'null'
        project_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        prerequisite_wait:
          type: boolean
          description: True while the Work is ready and waits for its prerequisite Works.
        waiting_on:
          type: array
          description: Unmet prerequisites while the state is memo or ready; empty otherwise.
          items:
            $ref: '#/components/schemas/WorkPrerequisite'
      additionalProperties: false
    WorkDetail:
      type: object
      required:
        - id
        - display_number
        - title
        - state
        - state_version
        - updated_at
        - archived_at
        - owner_id
        - project_id
        - summary
        - size
        - plan_revision
        - progress
        - conversation_id
        - prerequisite_wait
        - waiting_on
        - prerequisites
        - can_move_to_project
        - final_report
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        display_number:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        title:
          type: string
        state:
          $ref: '#/components/schemas/WorkState'
        state_version:
          $ref: '#/components/schemas/Version'
        updated_at:
          $ref: '#/components/schemas/RFC3339'
        archived_at:
          anyOf:
            - $ref: '#/components/schemas/RFC3339'
            - type: 'null'
        owner_id:
          type: string
        project_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        summary:
          type: string
        size:
          $ref: '#/components/schemas/WorkSize'
        plan_revision:
          $ref: '#/components/schemas/Version'
        progress:
          $ref: '#/components/schemas/WorkProgress'
        conversation_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        prerequisite_wait:
          type: boolean
          description: True while the Work is ready and waits for its prerequisite Works.
        waiting_on:
          type: array
          description: Unmet prerequisites while the state is memo or ready; empty otherwise.
          items:
            $ref: '#/components/schemas/WorkPrerequisite'
        prerequisites:
          type: array
          description: All prerequisites in position order.
          items:
            $ref: '#/components/schemas/WorkPrerequisite'
        can_move_to_project:
          type: boolean
        final_report:
          anyOf:
            - type: object
              required: [summary, test_results, issues, created_at]
              properties:
                summary:
                  type: string
                test_results:
                  type: string
                issues:
                  type: string
                created_at:
                  $ref: '#/components/schemas/RFC3339'
              additionalProperties: false
            - type: 'null'
      additionalProperties: false
    WorkViewDetail:
      type: object
      required:
        - id
        - display_number
        - title
        - state
        - state_version
        - updated_at
        - archived_at
        - owner_id
        - project_id
        - summary
        - size
        - plan_revision
        - progress
        - conversation_id
        - prerequisite_wait
        - waiting_on
        - prerequisites
        - design_mode
        - advisor_backlog
        - can_move_to_project
        - final_report
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        display_number:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        title:
          type: string
        state:
          $ref: '#/components/schemas/WorkState'
        state_version:
          $ref: '#/components/schemas/Version'
        updated_at:
          $ref: '#/components/schemas/RFC3339'
        archived_at:
          anyOf:
            - $ref: '#/components/schemas/RFC3339'
            - type: 'null'
        owner_id:
          type: string
        project_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        summary:
          type: string
        size:
          $ref: '#/components/schemas/WorkSize'
        plan_revision:
          $ref: '#/components/schemas/Version'
        progress:
          $ref: '#/components/schemas/WorkProgress'
        conversation_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        prerequisite_wait:
          type: boolean
          description: True while the Work is ready and waits for its prerequisite Works.
        waiting_on:
          type: array
          description: Unmet prerequisites while the state is memo or ready; empty otherwise.
          items:
            $ref: '#/components/schemas/WorkPrerequisite'
        prerequisites:
          type: array
          description: All prerequisites in position order.
          items:
            $ref: '#/components/schemas/WorkPrerequisite'
        can_move_to_project:
          type: boolean
        final_report:
          anyOf:
            - type: object
