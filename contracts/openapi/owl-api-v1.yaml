openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Owl API v1
  version: 1.0.0
  description: REST and WebSocket wire contract for the Owl MVP.
x-contract-version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Core health
      description: Loopback-only health endpoint.
      security: []
      responses:
        '200':
          description: Core is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: core_not_ready
          x-error-codes:
            - core_not_ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: System status
      security:
        - ownerBearer: []
        - localCsrf: []
      parameters:
        - in: query
          name: verbose
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: System status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works:
    get:
      operationId: listWorks
      summary: List works
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: state
          required: false
          schema:
            type:
              - string
              - 'null'
        - in: query
          name: archived
          required: false
          schema:
            type: string
            enum:
              - exclude
              - include
              - only
            default: exclude
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: cursor
          required: false
          schema:
            type:
              - string
              - 'null'
      responses:
        '200':
          description: Work list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkListResponse'
        '400':
          description: invalid_query
          x-error-codes:
            - invalid_query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createWork
      summary: Create a work
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkCommand'
      responses:
        '201':
          description: Work created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkResponse'
        '400':
          description: validation_error
          x-error-codes:
            - validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: project_not_found
          x-error-codes:
            - project_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: idempotency_conflict
          x-error-codes:
            - idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: getWork
      summary: Get a work
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: include
          required: false
          schema:
            type:
              - string
              - 'null'
      responses:
        '200':
          description: Work detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDetailResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteWork
      summary: Permanently delete an archived work
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyCommand'
      responses:
        '200':
          description: Work deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkResponse'
        '400':
          description: Invalid command envelope or payload.
          x-error-codes:
            - validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Work state, version, or idempotency conflict.
          x-error-codes:
            - invalid_state_transition
            - work_not_archived
            - work_has_active_agents
            - work_has_open_decisions
            - version_conflict
            - idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: dependency_unavailable or worktree_cleanup_failed. For worktree_cleanup_failed, details include each blocked worktree path, ignored_count, and ignored_paths.
          x-error-codes:
            - dependency_unavailable
            - worktree_cleanup_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkErrorResponse'
  /api/v1/works/{work_id}/branch-status:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: getWorkBranchStatus
      summary: Whether the Work's branches hold changes outside the Project base branch
      description: Read from Git refs on demand. unknown when the status could not be read; clients treat it as possibly unmerged.
      security:
        - ownerBearer: []
      responses:
        '200':
          description: Work branch status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkBranchStatusResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/designs:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: listWorkDesigns
      summary: List external design documents for a Work
      security:
        - ownerBearer: []
      responses:
        '200':
          description: Design documents in Task order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDesignListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/backlog:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: listWorkBacklog
      summary: List review backlog items from a Work
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Backlog items originating from the Work, in any status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogListResponse'
        '400':
          description: Invalid Work ID.
          x-error-codes: [validation_error]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes: [work_not_found]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/designs/{task_id}:
    parameters:
      - $ref: '#/components/parameters/WorkId'
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getWorkDesign
      summary: Read one external design document
      security:
        - ownerBearer: []
      responses:
        '200':
          description: Design document contents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDesignResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found or design_document_not_found
          x-error-codes:
            - work_not_found
            - design_document_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      operationId: archiveWork
      summary: Archive a completed or cancelled work
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyCommand'
      responses:
        '200':
          description: Work archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveWorkResponse'
        '400':
          description: Invalid command envelope or payload.
          x-error-codes:
            - validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Work state, version, or idempotency conflict.
          x-error-codes:
            - invalid_state_transition
            - work_has_active_agents
            - work_has_open_decisions
            - version_conflict
            - idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: dependency_unavailable
          x-error-codes:
            - dependency_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      operationId: unarchiveWork
      summary: Remove a work from the archive
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyCommand'
      responses:
        '200':
          description: Work unarchived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnarchiveWorkResponse'
        '400':
          description: Invalid command envelope or payload.
          x-error-codes:
            - validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: work_not_found
          x-error-codes:
            - work_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Work state, version, or idempotency conflict.
          x-error-codes:
            - invalid_state_transition
            - version_conflict
            - idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: dependency_unavailable
          x-error-codes:
            - dependency_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/start:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      operationId: startWork
      summary: Start a work
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkCommand'
      responses:
        '200':
          description: Work started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartWorkResponse'
        '400':
          description: Request validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Work not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: invalid_state_transition, version_conflict, or idempotency_conflict
          x-error-codes:
            - invalid_state_transition
            - version_conflict
            - idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/pause:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      operationId: pauseWork
      summary: Pause a work
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseWorkCommand'
      responses:
        '200':
          description: Work pause requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseWorkResponse'
        '404':
          description: Work not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/resume:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      operationId: resumeWork
      summary: Resume a work
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyCommand'
      responses:
        '200':
          description: Work resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeWorkResponse'
        '404':
          description: Work not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      operationId: cancelWork
      summary: Cancel a work
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelWorkCommand'
      responses:
        '200':
          description: Work cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelWorkResponse'
        '404':
          description: Work not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/reopen:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      operationId: reopenWork
      summary: Reopen a completed work for follow-up changes
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenWorkCommand'
      responses:
        '200':
          description: Work returned to running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReopenWorkResponse'
        '400':
          description: validation_error (unknown payload keys, or a reason that is not a 1-1000 character non-blank string).
          x-error-codes:
            - validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Work not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (the work is not completed, or expected_version is stale).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/works/{work_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      operationId: listWorkTasks
      summary: List tasks in a work
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type:
              - string
              - 'null'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - in: query
          name: cursor
          required: false
          schema:
            type:
              - string
              - 'null'
      responses:
        '200':
          description: Task list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          description: Request validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Work not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getTask
      summary: Get a task
      security:
        - ownerBearer: []
        - agentToken: []
      parameters:
        - in: query
          name: include_report
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Task detail and optional report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: agent_scope_denied
          x-error-codes:
            - agent_scope_denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/decisions:
    get:
      operationId: listDecisions
      summary: List decisions
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: status
          required: true
          schema:
            type: string
            enum:
              - open
              - resolved
              - cancelled
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - in: query
          name: cursor
          required: false
          schema:
            type:
              - string
              - 'null'
      responses:
        '200':
          description: Decision list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionListResponse'
        '400':
          description: Request validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/decisions/{decision_id}/answer:
    parameters:
      - $ref: '#/components/parameters/DecisionId'
    post:
      operationId: answerDecision
      summary: Answer a decision
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerDecisionCommand'
      responses:
        '200':
          description: Decision resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerDecisionResponse'
        '400':
          description: Request validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Decision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: decision_already_resolved, version_conflict, or idempotency_conflict
          x-error-codes:
            - decision_already_resolved
            - version_conflict
            - idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/conversations/{conversation_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listMessages
      summary: List conversation messages
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: cursor
          required: false
          schema:
            type:
              - string
              - 'null'
      responses:
        '200':
          description: Message list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createConversationMessage
      summary: Send a conversation message
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageCommand'
      responses:
        '201':
          description: Message accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageResponse'
        '400':
          description: Request validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/agents:
    get:
      operationId: listAgentRuns
      summary: List agent runs
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type:
              - string
              - 'null'
        - in: query
          name: work_id
          required: false
          schema:
            type:
              - string
              - 'null'
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        - in: query
          name: limit
