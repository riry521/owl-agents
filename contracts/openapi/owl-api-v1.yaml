          type: array
          items:
            type: object
            required:
              - kind
              - target
              - description
            properties:
              kind:
                type: string
                enum: [task, work, base_branch, owner, process]
              target:
                type: [string, 'null']
                description: The Task or Work id the condition waits for; for process the done_path or pid; null for base_branch and owner.
              description:
                type: string
            additionalProperties: false
        deadline_at:
          $ref: '#/components/schemas/RFC3339'
        since:
          oneOf:
            - $ref: '#/components/schemas/RFC3339'
            - type: 'null'
      additionalProperties: false
