          $ref: '#/components/schemas/ULID'
        filename:
          type: string
        mime:
          type: string
        bytes:
          type: integer
        status:
          type: string
          enum:
            - stored
            - quarantined
      additionalProperties: false
    CreateMessageCommand:
      allOf:
