    AdvisorWindowSettingsData:
      type: object
      required: [idle_timeout_seconds, channel_name_prefix, channel_name_max_length, history_handoff_messages, project_backlog_limit, handoff_summary_max_chars]
      properties:
        idle_timeout_seconds: { type: integer, minimum: 60, maximum: 604800, description: "Seconds without activity before a window session is suspended." }
        channel_name_prefix:
          type: string
          description: Empty, or at most 20 lowercase letters, digits, "_" and single "-" separators; may end in one "-".
