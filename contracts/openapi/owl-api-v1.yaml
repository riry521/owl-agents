          anyOf:
            - type: object
              required: [linked, dismissed]
              properties:
                linked:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdvisorBacklogEntry'
                dismissed:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdvisorBacklogEntry'
            - type: 'null'
      additionalProperties: false
    AdvisorBacklogEntry:
      type: object
      required: [id, file, line, problem]
      properties:
        id:
          type: string
        file:
          type: [string, 'null']
        line:
          type: [integer, 'null']
        problem:
          type: string
    WorkPrerequisite:
      type: object
      required: [work_id, project_id, project_name, display_number, title, state, deleted, satisfied]
      properties:
        work_id:
          $ref: '#/components/schemas/ULID'
        project_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        project_name:
          type:
            - string
            - 'null'
        display_number:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        title:
          type: string
        state:
          anyOf:
            - $ref: '#/components/schemas/WorkState'
            - type: 'null'
          description: Null once the prerequisite Work was deleted.
        deleted:
          type: boolean
        satisfied:
          type: boolean
          description: True when the prerequisite is completed, including one that was completed before it was deleted.
      additionalProperties: false
    WorkProgress:
      type: object
      required:
        - total_tasks
        - completed_tasks
        - percent
      properties:
        total_tasks:
          type: integer
          minimum: 0
          description: Count of all Tasks associated with the Work.
        completed_tasks:
          type: integer
          minimum: 0
          description: Count of Tasks whose status is completed.
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Rounded completed_tasks / total_tasks percentage; 0 when there are no Tasks.
      additionalProperties: false
    WorkViewResponse:
