  /api/v1/events:
    get:
      operationId: listEvents
      summary: Page through the durable event log
      description: >-
        Ascending (default) pages read events after the exclusive `after`
        cursor; pass the previous page's `cursor` as `after` to continue.
        With `order=desc` the newest events come first and `before` is an
        exclusive sequence cursor for older pages; `after` is rejected then,
        and `before` is only accepted with `order=desc`. `has_more` is true
        when the page is full (`events.length == limit`).
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: after
          required: false
          description: Exclusive sequence cursor (ascending order only). Defaults to 0.
          schema:
            type: string
            pattern: '^[0-9]+$'
        - in: query
          name: before
          required: false
          description: Exclusive sequence cursor (order=desc only). Omit for the newest page.
          schema:
            type: string
            pattern: '^[0-9]+$'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: invalid_query (malformed after/before/limit/order or an invalid combination).
          x-error-codes:
            - invalid_query
