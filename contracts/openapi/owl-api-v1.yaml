      additionalProperties: false
    UpdateAutoRecoverySettingsPayload:
      $ref: '#/components/schemas/AutoRecoverySettingsData'
    ReviewRoutingSettingsData:
      type: object
      required: [type_defaults, max_changed_lines, max_changed_files, sensitive_paths, force_on_hybrid_delegation, force_on_gate_failure_history, force_on_rejection_history]
      properties:
        type_defaults:
          type: object
          required: [code, doc, config, test, research]
          properties:
            code: { type: string, enum: [required, not_required] }
            doc: { type: string, enum: [required, not_required] }
            config: { type: string, enum: [required, not_required] }
            test: { type: string, enum: [required, not_required] }
            research: { type: string, enum: [required, not_required] }
          additionalProperties: false
        max_changed_lines: { type: integer, minimum: 0, maximum: 100000, description: "Added plus deleted lines above this force the Reviewer." }
        max_changed_files: { type: integer, minimum: 0, maximum: 10000, description: "Changed files above this force the Reviewer." }
        sensitive_paths:
          type: object
          maxProperties: 50
          description: Group name (1 to 100 characters) to globs; a changed path matching any glob forces the Reviewer.
          additionalProperties:
            type: array
            maxItems: 200
            items: { type: string, minLength: 1, maxLength: 500 }
        force_on_hybrid_delegation: { type: boolean }
        force_on_gate_failure_history: { type: boolean }
        force_on_rejection_history: { type: boolean }
      additionalProperties: false
    UpdateReviewRoutingSettingsPayload:
      $ref: '#/components/schemas/ReviewRoutingSettingsData'
