  /api/v1/events:
    get:
      operationId: listEvents
      summary: Page through the durable event log
      description: >-
        Ascending (default) pages read events after the exclusive `after`
        cursor; pass the previous page's `cursor` as `after` to continue.
        With `order=desc` the newest events come first and `before` is an
        exclusive sequence cursor for older pages; `after` is rejected then,
        and `before` is only accepted with `order=desc`. `has_more` is true
        when the page is full (`events.length == limit`).
      security:
        - ownerBearer: []
      parameters:
        - in: query
          name: after
          required: false
          description: Exclusive sequence cursor (ascending order only). Defaults to 0.
          schema:
            type: string
            pattern: '^[0-9]+$'
        - in: query
          name: before
          required: false
          description: Exclusive sequence cursor (order=desc only). Omit for the newest page.
          schema:
            type: string
            pattern: '^[0-9]+$'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: invalid_query (malformed after/before/limit/order or an invalid combination).
          x-error-codes:
            - invalid_query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/ws:
    get:
      operationId: openWebSocket
      summary: Open the Owl event WebSocket
      description: Upgrade after owner/service Bearer and Origin/CSRF checks. Events are at-least-once and ordered by sequence within a Work.
      security:
        - ownerBearer: []
        - connectorServiceToken: []
        - advisorServiceToken: []
      responses:
        '101':
          description: Switching protocols. Send a WebSocket client frame after connection.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ownerBearer:
      type: http
      scheme: bearer
    localCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
    connectorServiceToken:
      type: http
      scheme: bearer
    advisorServiceToken:
      type: http
      scheme: bearer
    agentToken:
      type: http
      scheme: bearer
  parameters:
    SkillName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
    SkillFilePath:
      name: path
      in: path
      required: true
      description: Slash-delimited relative path to SKILL.md or a file directly under an allowed skill directory.
      schema:
        type: string
        minLength: 1
    SkillRevisionId:
      name: revision_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    SkillProposalId:
      name: proposal_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkId:
      name: work_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    DecisionId:
      name: decision_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    AgentRunId:
      name: agent_run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ULID'
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
  schemas:
    ULID:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
    RFC3339:
      type: string
      format: date-time
    Version:
      type: integer
      minimum: 0
    WorkState:
      type: string
      minLength: 1
      description: >-
        Known values are memo, ready, running, paused, judgement_waiting,
        completed, and cancelled. Servers may return future values, which
        clients must preserve and render safely.
    WorkSize:
      type: string
      enum:
        - small
        - normal
        - large
    TaskState:
      type: string
      enum:
        - waiting
        - ready
        - running
        - paused
        - verifying
        - review_fix_waiting
        - failed
        - judgement_waiting
        - completed
        - cancelled
    MessageSource:
      type: string
      enum:
        - slack
        - discord
        - web
    OpaqueObject:
      type: object
      additionalProperties: true
    CommandRequest:
      type: object
      required:
        - request_id
        - idempotency_key
        - expected_version
        - payload
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
        expected_version:
          $ref: '#/components/schemas/Version'
        payload:
          type: object
          additionalProperties: true
      additionalProperties: false
    EmptyCommand:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/EmptyPayload'
    Response:
      type: object
      required:
        - request_id
        - data
        - version
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          type: object
          additionalProperties: true
        version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    ListResponse:
      type: object
      required:
        - request_id
        - data
        - cursor
        - has_more
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
      additionalProperties: false
    EventFrame:
      type: object
      description: Same shape as the WebSocket `event` frame (websocket-server-frame.json).
      required:
        - kind
        - event_id
        - sequence
        - cursor
        - type
        - schema_version
        - payload
      properties:
        kind:
          const: event
        event_id:
          $ref: '#/components/schemas/ULID'
        sequence:
          type: integer
        cursor:
          type: string
        type:
          type: string
        schema_version:
          const: 1.0.0
        work_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        task_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        agent_run_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/RFC3339'
        payload:
          type: object
          additionalProperties: true
      additionalProperties: false
    EventListResponse:
      type: object
      required:
        - request_id
        - data
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          type: object
          required:
            - events
            - cursor
            - has_more
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/EventFrame'
            cursor:
              type: string
              description: >-
                Ascending: sequence of the last event (or the `after` value when
                empty). Descending: sequence of the oldest event in the page,
                to pass as `before` for the next older page.
            has_more:
              type: boolean
          additionalProperties: false
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - request_id
        - error
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          additionalProperties: false
      additionalProperties: false
    WorktreeCleanupIssue:
      type: object
      required:
        - path
        - ignored_count
        - ignored_paths
      properties:
        path:
          type: string
        ignored_count:
          type: integer
          minimum: 0
        ignored_paths:
          type: array
          items:
            type: string
      additionalProperties: false
    WorktreeCleanupErrorDetails:
      type: object
      properties:
        worktrees:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeCleanupIssue'
      additionalProperties: true
    DeleteWorkErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              required:
                - code
                - details
              properties:
                code:
                  type: string
                  enum:
                    - dependency_unavailable
                    - worktree_cleanup_failed
                details:
                  $ref: '#/components/schemas/WorktreeCleanupErrorDetails'
    EmptyPayload:
      type: object
      additionalProperties: false
    CreateWorkPayload:
      type: object
      required:
        - title
        - summary
        - size
        - project_id
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        summary:
          type: string
          maxLength: 20000
        size:
          type: string
          description: small creates one focused Task directly for the Worker; normal and large start with Manager planning.
          enum:
            - small
            - normal
            - large
        project_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        design_mode:
          type: string
          enum: [auto, lead]
          description: Optional. Lead assigns design Tasks to Lead Designer from their first run.
      additionalProperties: false
    CreateWorkCommand:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/CreateWorkPayload'
    WorkSummary:
      type: object
      required:
        - id
        - display_number
        - title
        - state
        - state_version
        - updated_at
        - archived_at
        - project_id
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        display_number:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        title:
          type: string
        state:
          $ref: '#/components/schemas/WorkState'
        state_version:
          $ref: '#/components/schemas/Version'
        updated_at:
          $ref: '#/components/schemas/RFC3339'
        archived_at:
          anyOf:
            - $ref: '#/components/schemas/RFC3339'
            - type: 'null'
        project_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
      additionalProperties: false
    WorkDetail:
      type: object
      required:
        - id
        - display_number
        - title
        - state
        - state_version
        - updated_at
        - archived_at
        - owner_id
        - project_id
        - summary
        - size
        - design_mode
        - plan_revision
        - progress
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        display_number:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        title:
          type: string
        state:
          $ref: '#/components/schemas/WorkState'
        state_version:
          $ref: '#/components/schemas/Version'
        updated_at:
          $ref: '#/components/schemas/RFC3339'
        archived_at:
          anyOf:
            - $ref: '#/components/schemas/RFC3339'
            - type: 'null'
        owner_id:
          type: string
        project_id:
          anyOf:
            - $ref: '#/components/schemas/ULID'
            - type: 'null'
        summary:
          type: string
        size:
          $ref: '#/components/schemas/WorkSize'
        design_mode:
          type: string
          enum: [auto, lead]
        plan_revision:
          $ref: '#/components/schemas/Version'
        progress:
          $ref: '#/components/schemas/WorkProgress'
      additionalProperties: false
    WorkProgress:
      type: object
      required:
        - total_tasks
        - completed_tasks
        - percent
      properties:
        total_tasks:
          type: integer
          minimum: 0
          description: Count of all Tasks associated with the Work.
        completed_tasks:
          type: integer
          minimum: 0
          description: Count of Tasks whose status is completed.
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Rounded completed_tasks / total_tasks percentage; 0 when there are no Tasks.
      additionalProperties: false
    WorkDetailResponse:
      type: object
      required:
        - request_id
        - data
        - version
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          $ref: '#/components/schemas/WorkDetail'
        version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    ArchiveWorkResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties:
            data:
              type: object
              required:
                - work_id
                - archived_at
              properties:
                work_id:
                  $ref: '#/components/schemas/ULID'
                archived_at:
                  $ref: '#/components/schemas/RFC3339'
              additionalProperties: false
    UnarchiveWorkResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties:
            data:
              type: object
              required:
                - work_id
                - archived_at
              properties:
                work_id:
                  $ref: '#/components/schemas/ULID'
                archived_at:
                  type: 'null'
              additionalProperties: false
    DeleteWorkResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties:
            data:
              type: object
              required:
                - work_id
                - deleted
              properties:
                work_id:
                  $ref: '#/components/schemas/ULID'
                deleted:
                  const: true
              additionalProperties: false
    WorkBranchStatusResponse:
      type: object
      required:
        - request_id
        - data
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          type: object
          required:
            - work_id
            - unmerged_changes
          properties:
            work_id:
              $ref: '#/components/schemas/ULID'
            unmerged_changes:
              type: string
              enum:
                - present
                - absent
                - unknown
          additionalProperties: false
      additionalProperties: false
    WorkDesignListResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties:
            data:
              type: object
              required:
                - designs
              properties:
                designs:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkDesignSummary'
              additionalProperties: false
    WorkDesignResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkDesign'
    WorkDesignSummary:
      type: object
      required:
        - task_id
        - title
        - updated_at
        - size_bytes
      properties:
        task_id:
          $ref: '#/components/schemas/ULID'
        title:
          type: string
        updated_at:
          $ref: '#/components/schemas/RFC3339'
        size_bytes:
          type: integer
          minimum: 0
      additionalProperties: false
    WorkDesign:
      type: object
      required:
        - task_id
        - title
        - markdown
        - updated_at
      properties:
        task_id:
          $ref: '#/components/schemas/ULID'
        title:
          type: string
        markdown:
          type: string
        updated_at:
          $ref: '#/components/schemas/RFC3339'
      additionalProperties: false
    WorkListResponse:
      allOf:
        - $ref: '#/components/schemas/ListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/WorkSummary'
    CreateWorkResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties:
            data:
              type: object
              required:
                - work_id
                - state
                - state_version
              properties:
                work_id:
                  $ref: '#/components/schemas/ULID'
                state:
                  type: string
                  enum:
                    - memo
                    - ready
                state_version:
                  $ref: '#/components/schemas/Version'
              additionalProperties: false
    StartWorkPayload:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - normal
            - small
      additionalProperties: false
    StartWorkCommand:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/StartWorkPayload'
    StartWorkResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties:
            data:
              type: object
              required:
                - work_id
                - state
                - started
              properties:
                work_id:
                  $ref: '#/components/schemas/ULID'
                state:
                  const: running
                started:
                  type: boolean
              additionalProperties: false
    PauseWorkPayload:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 1000
      additionalProperties: false
    PauseWorkCommand:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/PauseWorkPayload'
    PauseWorkResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties:
            data:
              type: object
              required:
                - work_id
                - state
                - signal
              properties:
                work_id:
                  $ref: '#/components/schemas/ULID'
                state:
                  const: paused
                signal:
                  const: pause_requested
              additionalProperties: false
    ResumeWorkResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - work_id
                - state
              properties:
                work_id:
                  $ref: '#/components/schemas/ULID'
                state:
                  const: running
              additionalProperties: false
    ReopenWorkPayload:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Optional; when present it must not be blank.
      additionalProperties: false
    ReopenWorkCommand:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/ReopenWorkPayload'
    ReopenWorkResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - work_id
                - state
              properties:
                work_id:
                  $ref: '#/components/schemas/ULID'
                state:
                  const: running
              additionalProperties: false
    CancelWorkPayload:
      type: object
      required:
        - reason
        - force
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        force:
          type: boolean
          default: false
      additionalProperties: false
    CancelWorkCommand:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/CancelWorkPayload'
    CancelWorkResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties:
            data:
              type: object
              required:
                - work_id
                - state
                - cancel_requested
              properties:
                work_id:
                  $ref: '#/components/schemas/ULID'
                state:
                  const: cancelled
                cancel_requested:
                  type: boolean
              additionalProperties: false
    TaskSummary:
      type: object
      required:
        - id
        - work_id
        - title
        - status
        - type
        - state_version
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        work_id:
          $ref: '#/components/schemas/ULID'
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskState'
        type:
          type: string
        state_version:
          $ref: '#/components/schemas/Version'
        updated_at:
          $ref: '#/components/schemas/RFC3339'
      additionalProperties: false
    TaskDetail:
      type: object
      required:
        - id
        - work_id
        - title
        - status
        - type
        - state_version
        - updated_at
        - parent_task_id
        - acceptance
        - review_round
        - failure_count
        - worker_generation
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        work_id:
          $ref: '#/components/schemas/ULID'
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskState'
        type:
          type: string
        state_version:
          $ref: '#/components/schemas/Version'
        updated_at:
          $ref: '#/components/schemas/RFC3339'
        parent_task_id:
          type:
            - string
            - 'null'
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        acceptance:
          type: string
        review_round:
          $ref: '#/components/schemas/Version'
        failure_count:
          $ref: '#/components/schemas/Version'
        worker_generation:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    TaskListResponse:
      allOf:
        - $ref: '#/components/schemas/ListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TaskSummary'
    TaskDetailResponse:
      type: object
      required:
        - request_id
        - data
        - report
        - version
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          $ref: '#/components/schemas/TaskDetail'
        report:
          anyOf:
            - $ref: '#/components/schemas/Report'
            - type: 'null'
        version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    Report:
      type: object
      required:
        - id
        - agent_run_id
        - schema_version
        - result
        - payload
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        agent_run_id:
          $ref: '#/components/schemas/ULID'
        schema_version:
          type: string
        result:
          type: string
          enum:
            - success
            - failed
            - partial
        payload:
          $ref: '#/components/schemas/OpaqueObject'
        created_at:
          $ref: '#/components/schemas/RFC3339'
      additionalProperties: false
    Decision:
      type: object
      required:
        - id
        - work_id
        - scope
        - status
        - reason
        - question
        - current_state
        - tried
        - options
        - recommended
        - allow_free_text
        - blocked_task_ids
        - state_version
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        work_id:
          $ref: '#/components/schemas/ULID'
        scope:
          type: string
          enum:
            - task
            - work
        status:
          type: string
          enum:
            - open
            - resolved
            - cancelled
        reason:
          type: string
        question:
          type: string
        current_state:
          type: string
        tried:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/OpaqueObject'
        recommended:
          type:
            - string
            - 'null'
        allow_free_text:
          type: boolean
          description: When false the owner must pick one of the options.
        blocked_task_ids:
          type: array
          items:
            $ref: '#/components/schemas/ULID'
        state_version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    DecisionListResponse:
      allOf:
        - $ref: '#/components/schemas/ListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Decision'
    AnswerDecisionPayload:
      type: object
      required:
        - answer
        - option_key
        - source
        - source_message_id
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 10000
          description: When option_key is set, must equal that option's label exactly.
        option_key:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - web
            - slack
            - discord
        source_message_id:
          type:
            - string
            - 'null'
      additionalProperties: false
    AnswerDecisionCommand:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/AnswerDecisionPayload'
