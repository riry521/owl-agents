_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: owl-agent
  description: AI multi-agent orchestration advisor
  background_color: "#6366f1"
features:
  bot_user:
    display_name: owl-agent
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - groups:history
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
